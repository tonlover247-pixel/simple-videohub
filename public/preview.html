<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple VideoHub</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; display: flex; height: 100vh; }
    #sidebar { width: 320px; background: #1a1a1a; padding: 16px; overflow-y: auto; border-right: 1px solid #333; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #preview-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
    #film-frame { max-width: 100%; max-height: 100%; border: 1px solid #333; }
    canvas { position: absolute; pointer-events: none; }
    #controls { padding: 12px; background: #1a1a1a; display: flex; gap: 8px; align-items: center; }
    button { background: #ff6b00; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #e55a00; }
    input, textarea { background: #222; color: #eee; border: 1px solid #444; padding: 6px; border-radius: 4px; }
    .note { background: #222; margin: 8px 0; padding: 10px; border-radius: 6px; border-left: 3px solid #ff6b00; }
    .note small { color: #888; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    #film-select { width: 100%; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Simple VideoHub</h2>
    <select id="film-select"><option>Loading...</option></select>
    <button id="load-btn" style="width:100%; margin-bottom:16px;">Load Film</button>
    <h3>Notes</h3>
    <div id="notes-list"></div>
    <button id="copy-notes" style="width:100%; margin-top:12px;">Copy Notes for Claude</button>
    <p style="font-size:12px; color:#888; margin-top:16px;">Click on the preview to drop a circle and add a note.</p>
  </div>
  <div id="main">
    <div id="preview-container">
      <iframe id="film-frame" style="width:960px; height:540px; border:none;"></iframe>
      <canvas id="overlay"></canvas>
    </div>
    <div id="controls">
      <button id="play-pause">Play</button>
      <button id="step-back">◀</button>
      <button id="step-fwd">▶</button>
      <input type="range" id="scrubber" min="0" max="10" step="0.05" value="0" style="flex:1;">
      <span id="time-display">0.00s</span>
      <button id="add-note">Add Note at Current Time</button>
    </div>
  </div>
  <script src="preview.js"></script>
</body>
</html>
